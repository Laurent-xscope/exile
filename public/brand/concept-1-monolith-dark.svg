<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="c1-accent-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A4F" />
      <stop offset="60%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  
    <filter id="c1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="108" fill="#141312" stroke="#282523" stroke-width="2" />

  <!-- Emblem Group -->
  <g id="monolith-e" transform="translate(4, 0)">
    <!-- Top Cantilever Blade -->
    <path d="M 148 136 C 148 127.16 155.16 120 164 120 L 344 120 C 352.84 120 360 127.16 360 136 L 360 176 C 360 184.84 352.84 192 344 192 L 232 192 L 232 192 L 232 136 Z" 
          fill="#FAF8F5" />

    <!-- Monolithic Vertical Spine -->
    <rect x="148" y="136" width="84" height="240" rx="0" fill="#EFECE6" />

    <!-- Bottom Cantilever Blade -->
    <path d="M 148 376 C 148 384.84 155.16 392 164 392 L 344 392 C 352.84 392 360 384.84 360 376 L 360 336 C 360 327.16 352.84 320 344 320 L 232 320 L 232 376 Z" 
          fill="#FAF8F5" />

    <!-- Middle Cantilever Blade (Core) -->
    <rect x="232" y="228" width="88" height="56" rx="10" fill="#FAF8F5" />

    <!-- The Formative Closed-Loop Ribbon (Continuous Terracotta Link) -->
    <!-- Elegantly loops from the middle core around to the top/bottom return -->
    <path d="M 320 228 L 366 182 C 374 174 388 180 388 191 L 388 321 C 388 332 374 338 366 330 L 320 284 Z" 
          fill="url(#c1-accent-dark)" 
          filter="url(#c1-shadow)" />

    <!-- Center Precision Aperture Cut -->
    <circle cx="356" cy="256" r="6" fill="#141312" />
  </g>
</svg>
